<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student access | ATHENA.AI</title>
    <link rel="stylesheet" href="ATHENA.css?v=student-access-1" />
  </head>
  <body class="home-page student-access-page">
    <div class="starfield" data-star-count="100" aria-hidden="true">
      <span class="background-star star-one"></span>
      <span class="background-star star-two"></span>
      <span class="background-star star-three"></span>
      <span class="background-star star-four"></span>
      <span class="background-star star-five"></span>
      <span class="background-star star-six"></span>
      <span class="background-star star-seven"></span>
      <span class="background-star star-eight"></span>
      <span class="background-star star-nine"></span>
      <span class="background-star star-ten"></span>
    </div>
    <div class="page-shell">
      <header class="topbar">
        <a class="settings-nav-button" href="ATHENA.html">Home</a>
        <div class="brand">Student access</div>
        <a class="settings-nav-button" href="moderator.html">Admin</a>
      </header>

      <main class="main-content">
        <div class="title-block">
          <div class="hero-logo-frame">
            <img class="brand-logo" src="image-1791727904673.png" alt="ATHENA.AI" />
          </div>
          <h2>Student access</h2>
        </div>

        <section class="student-access-panel" aria-label="Student account access">
          <div class="student-access-tabs" role="tablist" aria-label="Student account options">
            <button id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="studentLoginForm">Sign in</button>
            <button id="setupTab" type="button" role="tab" aria-selected="false" aria-controls="studentSetupForm">Set up account</button>
          </div>

          <p class="student-access-note">Sign in with Google. Existing students must sign in with their current account once to link it and keep access to its chats.</p>
          <div id="googleSignInButton" aria-label="Sign in with Google"></div>
          <button id="continueWithExistingAccount" type="button" hidden>Continue with existing account</button>

          <form id="studentLoginForm" class="student-access-form" role="tabpanel" aria-labelledby="loginTab">
            <label for="loginName">Student account name
              <input id="loginName" name="name" autocomplete="username" maxlength="64" required />
            </label>
            <label for="loginPassword">Password
              <span class="password-input-row">
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="256" />
                <button type="button" data-toggle-password="loginPassword" aria-controls="loginPassword" aria-label="Show password">Show</button>
              </span>
            </label>
            <button type="submit">Sign in</button>
          </form>

          <form id="studentSetupForm" class="student-access-form" role="tabpanel" aria-labelledby="setupTab" hidden>
            <label for="setupName">Student account name
              <input id="setupName" name="name" autocomplete="username" maxlength="64" required />
            </label>
            <label for="setupCode">One-time setup code
              <input id="setupCode" name="setup_code" autocomplete="one-time-code" minlength="12" maxlength="64" required />
            </label>
            <label for="newPassword">Create password
              <span class="password-input-row">
                <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required />
                <button type="button" data-toggle-password="newPassword" aria-controls="newPassword" aria-label="Show password">Show</button>
              </span>
            </label>
            <label for="confirmPassword">Confirm password
              <span class="password-input-row">
                <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required />
                <button type="button" data-toggle-password="confirmPassword" aria-controls="confirmPassword" aria-label="Show password">Show</button>
              </span>
            </label>
            <button type="submit">Activate account</button>
          </form>

          <p id="studentAccessStatus" class="student-access-status" role="status" aria-live="polite"></p>
          <p class="student-access-note">Ask an Athena admin to create your account. The one-time setup code will be emailed to you.</p>
        </section>
      </main>
    </div>

    <script src="preferences.js"></script>
    <script src="stars.js"></script>
    <script src="cursor-trail.js"></script>
    <script src="athena-config.js"></script>
    <script src="password-toggle.js"></script>
    <script src="student-access.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="initializeGoogleSignIn()"></script>
  </body>
</html>
