services:
  - type: web
    name: athena-student-support
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && mkdir -p render_public && cp *.html *.css *.js *.png render_public/ && cp ATHENA.html render_public/index.html
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ATHENA_DATA_DIR
        value: /tmp/athena-data
      - key: ATHENA_COOKIE_SECURE
        value: "true"
      - key: ATHENA_IDENTITY_PEPPER
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ATHENA_MODERATOR_USERNAME
        sync: false
      - key: ATHENA_MODERATOR_PASSWORD
        sync: false