<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATHENA.AI Chat</title>
    <link rel="stylesheet" href="ATHENA.css" />
    <style>
      :root {
        --bg: #f7efe8;
        --sidebar: #f3e0d3;
        --panel: rgba(255, 255, 255, 0.7);
        --chat-bg: rgba(255, 255, 255, 0.36);
        --text: #2d1f20;
        --muted: #5d4d4d;
        --accent: #d88e6e;
        --accent-2: #d9b1a7;
        --soft: #f8d9d1;
        --shadow: rgba(73, 49, 51, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: var(--app-font-family, Arial, sans-serif);
        background: linear-gradient(180deg, var(--sky-bg, #f8f0ea) 0%, var(--bg) 52%, var(--ground-bg, #e6d4c3) 100%);
        color: var(--text);
        transition: background 0.4s ease;
        position: relative;
      }

      .chat-starfield {
        position: absolute;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .chat-starfield .generated-star {
        position: absolute;
        width: var(--generated-star-size);
        height: var(--generated-star-size);
        background: var(--star-color, #fff0a8);
        clip-path: polygon(50% 0, 59% 40%, 100% 50%, 59% 60%, 50% 100%, 41% 60%, 0 50%, 41% 40%);
        animation: denseStarTwinkle var(--generated-star-duration) ease-in-out var(--generated-star-delay) infinite;
      }

      .chat-star {
        position: absolute;
        width: 14px;
        height: 14px;
        background: var(--star-color, #fff0a8);
        clip-path: polygon(50% 0, 59% 40%, 100% 50%, 59% 60%, 50% 100%, 41% 60%, 0 50%, 41% 40%);
        filter: drop-shadow(0 0 7px var(--star-color, #fff0a8));
        animation: starTwinkle 4s ease-in-out infinite;
      }

      .chat-star:nth-child(1) { top: 12%; left: 12%; width: 20px; height: 20px; }
      .chat-star:nth-child(2) { top: 26%; right: 14%; animation-delay: 1.1s; }
      .chat-star:nth-child(3) { top: 56%; left: 7%; width: 10px; height: 10px; animation-delay: 2s; }
      .chat-star:nth-child(4) { bottom: 12%; right: 11%; width: 22px; height: 22px; animation-delay: 0.6s; }
      .chat-star:nth-child(5) { top: 9%; left: 47%; width: 9px; height: 9px; animation-delay: 1.7s; }
      .chat-star:nth-child(6) { top: 68%; right: 28%; width: 11px; height: 11px; animation-delay: 2.6s; }
      .chat-star:nth-child(7) { bottom: 22%; left: 32%; width: 8px; height: 8px; animation-delay: 3.1s; }

      @keyframes starTwinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.72); }
        50% { opacity: 0.95; transform: scale(1); }
      }

      .chat-page {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 280px 1fr;
        grid-template-rows: minmax(0, 1fr);
        width: min(1200px, 95vw);
        height: min(900px, calc(100dvh - 40px));
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.5);
        border-radius: 28px;
        box-shadow: 0 18px 40px var(--shadow);
        overflow: hidden;
        animation: chatEnter 0.45s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      @keyframes chatEnter {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .chat-page.guest-mode {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: 0;
        overflow-y: auto;
        background: var(--sidebar);
        padding: 20px 16px;
        border-right: 1px solid rgba(93, 77, 77, 0.08);
      }

      .sidebar[hidden] {
        display: none;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .new-btn {
        border: none;
        border-radius: 12px;
        padding: 8px 12px;
        background: rgba(255,255,255,0.4);
        font-weight: 700;
        cursor: pointer;
      }

      .log-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .log-entry {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .log-item {
        flex: 1;
        min-width: 0;
        padding: 14px 12px;
        border: none;
        border-radius: 16px;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: rgba(255,255,255,0.25);
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }

      .log-item.active {
        background: linear-gradient(135deg, #f3d8cb, #e4c4d7);
      }

      .delete-chat-btn {
        border: 0;
        border-radius: 10px;
        padding: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 0.8rem;
        cursor: pointer;
      }

      .delete-chat-btn:hover {
        background: rgba(255, 255, 255, 0.55);
        color: #8c3f46;
      }

      .main-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--chat-bg);
      }

      .chat-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 16px;
        padding: 22px 28px;
        border-bottom: 1px solid rgba(93, 77, 77, 0.08);
      }

      .chat-header h2 {
        grid-column: 2;
        margin: 0;
        font-size: 1.3rem;
        justify-self: center;
      }

      .chat-brand-logo-frame {
        grid-column: 1;
        width: 126px;
        justify-self: start;
      }

      .chat-header-status {
        grid-column: 3;
        display: flex;
        align-items: center;
        justify-self: end;
        gap: 10px;
        min-width: 0;
      }

      #chatProfileNameText {
        color: var(--chat-name-color, var(--text));
      }

      .app-menu {
        position: relative;
        z-index: 5;
      }

      .app-menu summary {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid rgba(93, 77, 77, 0.12);
        border-radius: 10px;
        background: rgba(255,255,255,0.5);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 700;
        list-style: none;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
      }

      .app-menu summary::-webkit-details-marker {
        display: none;
      }

      .app-menu summary:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.8);
        box-shadow: 0 7px 16px var(--shadow);
      }

      .chat-settings-link {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid rgba(93, 77, 77, 0.12);
        border-radius: 10px;
        background: rgba(255,255,255,0.5);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
      }

      .chat-settings-link:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.8);
        box-shadow: 0 7px 16px var(--shadow);
      }

      .chat-page-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }

      .chat-footer {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 20px 18px;
        border-top: 1px solid rgba(93, 77, 77, 0.08);
      }

      .app-menu-popover {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        display: grid;
        gap: 4px;
        width: min(220px, 80vw);
        padding: 8px;
        border: 1px solid rgba(93, 77, 77, 0.14);
        border-radius: 10px;
        background: rgba(255,255,255,0.96);
        box-shadow: 0 10px 24px var(--shadow);
      }

      .app-menu-popover a {
        padding: 10px;
        border-radius: 7px;
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .app-menu-popover a:hover,
      .app-menu-popover a[aria-current="page"] {
        background: rgba(243, 216, 203, 0.72);
      }

      .header-new-btn {
        border: none;
        border-radius: 12px;
        padding: 9px 12px;
        background: rgba(255,255,255,0.62);
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      .header-new-btn[hidden] {
        display: none;
      }

      .header-badge {
        background: rgba(255,255,255,0.5);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .header-badge[data-state="offline"] {
        background: #f4d9d9;
        color: #7a3338;
      }

      .messages {
        flex: 1;
        min-height: 0;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .message {
        max-width: 72%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.5;
        animation: messageIn 0.25s ease-out both;
      }

      .message-speaker {
        display: block;
        margin-bottom: 4px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .message.user .message-speaker {
        color: var(--chat-name-color, var(--accent));
      }

      .message.ai .message-speaker {
        color: var(--accent);
      }

      .message-content {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @keyframes messageIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .message.ai {
        align-self: flex-start;
        background: rgba(255,255,255,0.65);
      }

      .message.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #f0d7c7, #e7c5d2);
      }

      .message.error {
        align-self: flex-start;
        background: #f5dada;
        color: #702f35;
      }

      .empty-state {
        margin: auto;
        text-align: center;
        color: var(--muted);
        opacity: 0.8;
      }

      .composer {
        display: flex;
        flex: 1 1 auto;
        gap: 12px;
        min-width: 0;
      }

      .composer input {
        flex: 1;
        min-width: 0;
        border: none;
        border-radius: 999px;
        padding: 16px 18px;
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
      }

      .send-btn {
        border: none;
        border-radius: 999px;
        padding: 0 22px;
        background: linear-gradient(135deg, #d88e6e, #d4a1b8);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .send-btn:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      @media (max-width: 760px) {
        .chat-page {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
          width: 100%;
          height: 100vh;
          height: 100dvh;
          margin: 0;
          border: none;
          border-radius: 0;
        }

        .chat-page.guest-mode {
          grid-template-rows: minmax(0, 1fr);
        }

        .sidebar {
          max-height: 26vh;
          max-height: 26dvh;
          border-right: none;
          border-bottom: 1px solid rgba(93, 77, 77, 0.08);
        }

        .chat-header {
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-rows: auto auto;
          padding: 12px 16px;
          gap: 10px;
        }

        .chat-brand-logo-frame {
          grid-column: 1;
          grid-row: 1;
          width: min(96px, 100%);
        }

        .chat-header h2 {
          grid-column: 1 / -1;
          grid-row: 2;
        }

        .chat-header-status {
          grid-column: 2;
          grid-row: 1;
          gap: 6px;
        }

        .profile-name {
          max-width: 38vw;
          padding: 5px 8px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-size: 0.78rem;
        }

        .chat-footer {
          flex-direction: column-reverse;
          align-items: stretch;
          gap: 10px;
          padding: 12px 16px 16px;
        }

        .chat-page-actions {
          align-self: flex-start;
        }

        .messages {
          padding: 20px 16px;
        }

        .message {
          max-width: 88%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-starfield" data-star-count="70" aria-hidden="true">
      <span class="chat-star"></span>
      <span class="chat-star"></span>
      <span class="chat-star"></span>
      <span class="chat-star"></span>
      <span class="chat-star"></span>
      <span class="chat-star"></span>
      <span class="chat-star"></span>
    </div>
    <div class="chat-page">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="new-btn" id="newChatBtn" type="button">New</button>
        </div>

        <div class="log-list" id="logList"></div>
      </aside>

      <main class="main-panel">
        <header class="chat-header">
          <a class="brand-logo-frame chat-brand-logo-frame" href="ATHENA.html" aria-label="ATHENA.AI home">
            <img class="brand-logo" src="image-1791727904673.png" alt="ATHENA.AI" />
          </a>
          <h2>Chat</h2>
          <div class="chat-header-status">
            <span class="profile-name" id="chatProfileName" hidden>
              <span class="profile-chip-avatar" id="chatProfileAvatar" hidden>
                <span id="chatProfileInitial">A</span>
                <img id="chatProfileImage" alt="" hidden />
              </span>
              <span id="chatProfileNameText"></span>
            </span>
            <div class="header-badge" id="apiStatus" data-state="idle" role="status" aria-live="polite">Ready</div>
          </div>
        </header>

        <section class="messages" aria-label="Chat messages" id="messages"></section>

        <div class="chat-footer">
          <nav class="chat-page-actions" aria-label="Page navigation">
            <a class="chat-settings-link" href="settings.html">Settings</a>
            <a class="chat-settings-link" href="ATHENA.html">Home</a>
            <button class="chat-settings-link" id="studentLogoutBtn" type="button">Sign out</button>
          </nav>
          <div class="composer">
            <input id="messageInput" type="text" placeholder="Type your message..." />
            <button class="send-btn" id="sendBtn">Send</button>
          </div>
        </div>
      </main>
    </div>

    <script src="preferences.js"></script>
    <script src="stars.js"></script>
    <script src="cursor-trail.js"></script>
    <script src="athena-config.js"></script>
    <script>
      const chatPage = document.querySelector('.chat-page');
      const sidebar = document.getElementById('sidebar');
      const logList = document.getElementById('logList');
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const apiStatus = document.getElementById('apiStatus');
      const newChatBtn = document.getElementById('newChatBtn');
      const studentLogoutBtn = document.getElementById('studentLogoutBtn');
      const apiBase = window.ATHENA_API_BASE_URL ?? '';
      const studentSessionPromise = fetch(`${apiBase}/students/session`, { credentials: 'include' })
        .then((response) => response.status === 401 ? false : response.ok ? true : null)
        .catch(() => null);
      sendBtn.disabled = true;
      apiStatus.textContent = 'Checking sign-in';
      studentSessionPromise.then(async (isSignedIn) => {
        if (isSignedIn === true) {
          await loadConversations();
          sendBtn.disabled = false;
          if (apiStatus.dataset.state !== 'offline') {
            apiStatus.textContent = 'Ready';
            apiStatus.dataset.state = 'idle';
          }
        } else if (isSignedIn === false) {
          localStorage.removeItem('athenaAccountMode');
          window.location.replace('student-access.html');
        } else {
          apiStatus.textContent = 'Backend unavailable';
          apiStatus.dataset.state = 'offline';
        }
      });
      const hasAccount = true;
      let chatProfile = {};
      try {
        const savedProfile = JSON.parse(localStorage.getItem('athenaProfile') || '{}');
        if (savedProfile && typeof savedProfile === 'object' && !Array.isArray(savedProfile)) chatProfile = savedProfile;
      } catch {
        chatProfile = {};
      }
      const chatDisplayName = typeof chatProfile.displayName === 'string' && chatProfile.displayName.trim()
        ? chatProfile.displayName.trim()
        : (typeof chatProfile.name === 'string' && chatProfile.name.trim()
          ? chatProfile.name.trim()
          : (typeof chatProfile.fullName === 'string' && chatProfile.fullName.trim() ? chatProfile.fullName.trim() : (hasAccount ? 'User' : 'Guest')));
      const chatNameColor = typeof chatProfile.nameColor === 'string' && /^#[\da-f]{6}$/i.test(chatProfile.nameColor)
        ? chatProfile.nameColor
        : '';
      if (chatNameColor) document.documentElement.style.setProperty('--chat-name-color', chatNameColor);
      const savedTheme = localStorage.getItem('athenaBackgroundTheme');
      const savedCustomBackground = localStorage.getItem('athenaCustomBackground');
      const savedStarColor = localStorage.getItem('athenaStarColor');
      const chatThemePalettes = {
        warm: { sky: '#f7e8d6', main: '#f5e7d8', ground: '#e6d4c3', landscape: '#537158' },
        meadow: { sky: '#e7f0df', main: '#d6e6d1', ground: '#c3d6bc', landscape: '#44704d' },
        sky: { sky: '#e4eff5', main: '#d4e5eb', ground: '#c6d9d8', landscape: '#467777' },
        rose: { sky: '#f7e5e6', main: '#efd5df', ground: '#dfcbdc', landscape: '#775478' },
        sunrise: { sky: '#f8d7b3', main: '#f2b79f', ground: '#dca7a1', landscape: '#a97073' },
        noon: { sky: '#d6eef5', main: '#badfe7', ground: '#97c9bd', landscape: '#4e947d' },
        afternoon: { sky: '#f5e3b1', main: '#e8cf8e', ground: '#ced5a3', landscape: '#829a62' },
        evening: { sky: '#d3b5c9', main: '#b988aa', ground: '#876a91', landscape: '#675475' },
        midnight: { sky: '#111a3b', main: '#1b2552', ground: '#1b3a45', landscape: '#273f4c' },
        rainbow: { sky: '#f5bcc8', main: '#f2d19b', ground: '#b7dbea', landscape: '#a783c2' }
      };

      function applySavedBackground() {
        let colors = chatThemePalettes[savedTheme] || chatThemePalettes.warm;
        if (!savedTheme && savedCustomBackground) {
          try {
            const custom = JSON.parse(savedCustomBackground);
            colors = {
              sky: custom.skyColor || colors.sky,
              main: custom.bgColor || colors.main,
              ground: custom.groundColor || colors.ground,
              landscape: custom.landscapeColor || colors.landscape
            };
          } catch {
            colors = chatThemePalettes.warm;
          }
        }

        const root = document.documentElement;
        root.style.setProperty('--sky-bg', colors.sky);
        root.style.setProperty('--page-bg', colors.main);
        root.style.setProperty('--bg', colors.main);
        root.style.setProperty('--ground-bg', colors.ground);
        root.style.setProperty('--sidebar', colors.ground);
        root.style.setProperty('--hill-color', colors.landscape);
        if (savedStarColor && /^#[\da-f]{6}$/i.test(savedStarColor)) {
          root.style.setProperty('--star-color', savedStarColor);
        }
      }

      applySavedBackground();

      function createChat() {
        return { id: null, title: 'New chat', messages: [] };
      }

      const chats = [];
      let activeChatIndex = -1;
      let draftChat = null;
      let isSending = false;

      function syncSidebar() {
        const hasPastConversations = hasAccount;
        sidebar.hidden = !hasPastConversations;
        chatPage.classList.toggle('guest-mode', !hasPastConversations);
      }

      syncSidebar();

      async function loadConversations() {
        try {
          const response = await fetch(`${apiBase}/conversations`, { credentials: 'include' });
          if (!response.ok) throw new Error('Could not load conversations');
          const data = await response.json();
          chats.splice(0, chats.length, ...(Array.isArray(data.conversations) ? data.conversations : []));
          renderChatList();
          if (chats.length) {
            await selectConversation(chats[0]);
          } else {
            renderMessages();
          }
        } catch {
          apiStatus.textContent = 'History unavailable';
          apiStatus.dataset.state = 'offline';
          renderChatList();
          renderMessages();
        }
      }

      async function selectConversation(chat) {
        try {
          const response = await fetch(`${apiBase}/conversations/${encodeURIComponent(chat.id)}`, {
            credentials: 'include'
          });
          if (!response.ok) throw new Error('Could not load conversation');
          const data = await response.json();
          chat.title = data.title;
          chat.messages = data.messages.map((message) => ({
            role: message.role === 'assistant' ? 'ai' : 'user',
            text: message.text
          }));
          activeChatIndex = chats.findIndex((item) => item.id === chat.id);
          draftChat = null;
          renderChatList();
          renderMessages();
        } catch {
          apiStatus.textContent = 'History unavailable';
          apiStatus.dataset.state = 'offline';
        }
      }

      function renderChatList() {
        logList.innerHTML = '';
        syncSidebar();

        if (!hasAccount) return;

        chats.forEach((chat, index) => {
          const entry = document.createElement('div');
          entry.className = 'log-entry';

          const selectButton = document.createElement('button');
          selectButton.className = 'log-item' + (index === activeChatIndex ? ' active' : '');
          selectButton.type = 'button';
          selectButton.textContent = chat.title;
          selectButton.addEventListener('click', () => selectConversation(chat));

          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete-chat-btn';
          deleteButton.type = 'button';
          deleteButton.textContent = 'Delete';
          deleteButton.title = 'Delete conversation';
          deleteButton.setAttribute('aria-label', `Delete conversation: ${chat.title}`);
          deleteButton.addEventListener('click', () => deleteChat(index));

          entry.append(selectButton, deleteButton);
          logList.appendChild(entry);
        });
      }

      async function deleteChat(index) {
        const chat = chats[index];
        try {
          const response = await fetch(`${apiBase}/conversations/${encodeURIComponent(chat.id)}`, {
            method: 'DELETE',
            credentials: 'include'
          });
          if (!response.ok) throw new Error('Could not delete conversation');
        } catch {
          apiStatus.textContent = 'Delete failed';
          apiStatus.dataset.state = 'offline';
          return;
        }
        chats.splice(index, 1);
        if (chats.length === 0) {
          activeChatIndex = -1;
        } else if (index < activeChatIndex) {
          activeChatIndex -= 1;
        } else if (index === activeChatIndex) {
          activeChatIndex = Math.min(index, chats.length - 1);
        }
        renderChatList();
        if (activeChatIndex >= 0) {
          await selectConversation(chats[activeChatIndex]);
        } else {
          renderMessages();
        }
      }

      function renderMessages() {
        const chat = draftChat || chats[activeChatIndex];
        messagesEl.innerHTML = '';

        if (!chat || chat.messages.length === 0) {
          messagesEl.innerHTML = `<div class="empty-state">${hasAccount ? 'Start a new conversation.' : 'Hi, I’m here with you. What’s on your mind?'}</div>`;
          return;
        }

        chat.messages.forEach((message) => {
          const bubble = document.createElement('div');
          bubble.className = 'message ' + message.role;
          const speaker = document.createElement('span');
          speaker.className = 'message-speaker';
          speaker.textContent = message.role === 'user' ? chatDisplayName : 'Athena.AI';
          const content = document.createElement('div');
          content.className = 'message-content';
          content.textContent = message.text;
          bubble.append(speaker, content);
          messagesEl.appendChild(bubble);
        });

        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addNewThread() {
        if (hasAccount) {
          draftChat = createChat();
          activeChatIndex = -1;
        } else {
          chats.splice(0, chats.length, createChat());
          activeChatIndex = 0;
        }
        renderChatList();
        renderMessages();
      }

      async function sendMessage() {
        if (await studentSessionPromise !== true) return;
        const value = inputEl.value.trim();
        if (!value || isSending) return;

        let chat = draftChat || chats[activeChatIndex];
        if (!chat) {
          chat = createChat();
          draftChat = chat;
        }
        chat.messages.push({ role: 'user', text: value });

        if (chat.title === 'New chat') {
          chat.title = value.length > 32 ? `${value.slice(0, 32)}...` : value;
        }
        inputEl.value = '';
        isSending = true;
        sendBtn.disabled = true;
        apiStatus.textContent = 'Connecting';
        apiStatus.dataset.state = 'connecting';
        renderChatList();
        renderMessages();

        try {
          if (!chat.id) {
            const createResponse = await fetch(`${apiBase}/conversations`, {
              method: 'POST',
              credentials: 'include'
            });
            if (!createResponse.ok) throw new Error('Could not create conversation');
            const createdConversation = await createResponse.json();
            chat.id = createdConversation.id;
            chats.unshift(chat);
            activeChatIndex = 0;
            draftChat = null;
          }

          let profile = {};
          try {
            profile = JSON.parse(localStorage.getItem('athenaProfile') || '{}');
          } catch {
            profile = {};
          }
          const preferredName = typeof profile.aiCallsYou === 'string' ? profile.aiCallsYou.trim().slice(0, 32) : '';
          const pronouns = typeof profile.pronouns === 'string' ? profile.pronouns.trim().slice(0, 32) : '';
          const payload = { message: value, conversation_id: chat.id };
          if (preferredName) payload.preferred_name = preferredName;
          if (pronouns) payload.pronouns = pronouns;

          const response = await fetch(`${apiBase}/chat`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error('Chat request failed');
          }

          const data = await response.json();
          if (!data || typeof data.reply !== 'string' || !data.reply.trim()) {
            throw new Error('Chat response did not include a reply');
          }
          chat.messages.push({ role: 'ai', text: data.reply.trim() });
          chat.id = data.conversation_id;
          const chatIndex = chats.findIndex((item) => item.id === chat.id);
          if (chatIndex > 0) {
            chats.splice(chatIndex, 1);
            chats.unshift(chat);
            activeChatIndex = 0;
          }
          apiStatus.textContent = 'Online';
          apiStatus.dataset.state = 'online';
        } catch {
          chat.messages.push({ role: 'error', text: 'I couldn’t connect to Athena right now. Please try again in a moment.' });
          apiStatus.textContent = 'Offline';
          apiStatus.dataset.state = 'offline';
        } finally {
          isSending = false;
          sendBtn.disabled = false;
          renderChatList();
          if (draftChat === chat || chats[activeChatIndex] === chat) {
            renderMessages();
          }
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      studentLogoutBtn.addEventListener('click', async () => {
        try {
          await fetch(`${apiBase}/students/logout`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
          });
        } finally {
          localStorage.removeItem('athenaAccountMode');
          localStorage.removeItem('athenaChats');
          window.location.replace('ATHENA.html');
        }
      });
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });
      newChatBtn.addEventListener('click', addNewThread);

      renderChatList();
      renderMessages();
    </script>
  </body>
</html>
